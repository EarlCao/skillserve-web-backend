name: Tests

# Render deploys main, so every push to it and every pull request is checked.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    name: PHP 8.3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # The version the Docker images run (Dockerfile, Dockerfile.render).
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, exif
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      # Tests always run on in-memory SQLite (Tests\TestCase forces it).
      - name: Execute tests
        run: php artisan test

      - name: Check formatting
        run: ./vendor/bin/pint --test
