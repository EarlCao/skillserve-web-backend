# Single public port on Render: route WebSocket traffic to Reverb and
# everything else to the Laravel app. __PORT__ is replaced at start-up.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    client_max_body_size 20m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen __PORT__;

        # The app or Reverb is restarting (connection refused / timed out):
        # answer with a retryable JSON 503 instead of a bare 502 page.
        error_page 502 504 = @unavailable;

        location @unavailable {
            default_type application/json;
            add_header Retry-After 5 always;
            return 503 '{"success":false,"message":"The server is restarting. Please try again in a few seconds.","data":{},"errors":null,"meta":[]}';
        }

        # Reverb: /app/{key} is the WebSocket endpoint used by the web admin
        # and mobile app; /apps/{id}/events is its HTTP publish API.
        location ~ ^/apps?/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
        }
    }
}
