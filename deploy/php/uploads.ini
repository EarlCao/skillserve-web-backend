; Upload limits for the API. PHP's defaults (2M per file, 8M per request)
; refused most phone photos before Laravel could validate them.
; The largest request is a provider verification: 5 files of up to 10 MB
; (SubmitProviderVerificationRequest), so the body may reach ~50 MB.
; Keep nginx's client_max_body_size (deploy/render/nginx.conf) in step.
upload_max_filesize = 10M
post_max_size = 55M
max_file_uploads = 20
